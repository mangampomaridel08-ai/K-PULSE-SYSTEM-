<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K-PULSE | Enterprise K-Pop Ticketing Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen selection:bg-pink-500 selection:text-white" x-data="ticketingApp()">

    <!-- HEADER / NAV -->
    <header class="border-b border-slate-800/80 bg-slate-900/50 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3 cursor-pointer" @click="resetToHome()">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-pink-500 via-purple-500 to-cyan-400 flex items-center justify-center font-black text-xl shadow-lg shadow-pink-500/20">K</div>
                <span class="text-xl font-extrabold tracking-wider bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">K-PULSE</span>
            </div>
            <div class="flex items-center space-x-4">
                <button @click="openMyTickets()" class="text-xs px-3.5 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold border border-slate-700 transition-all flex items-center gap-1.5">
                    <svg class="w-4 h-4 text-pink-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 110 4v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 110-4V7a2 2 0 00-2-2H5z"></path></svg>
                    My Tickets (<span x-text="myBookings.length"></span>)
                </button>
                <span class="text-xs px-3 py-1 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 font-medium hidden sm:flex items-center gap-1.5">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                    Live Cluster Active
                </span>
            </div>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">

        <!-- VIEW 1: CONCERT LISTING -->
        <template x-if="step === 'listing'">
            <div>
                <div class="mb-8 text-center max-w-2xl mx-auto">
                    <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight mb-3">World Tour Ticketing Hub</h1>
                    <p class="text-slate-400 text-sm sm:text-base">Select your favorite group to enter the high-concurrency virtual queue and secure verified seats.</p>
                </div>

                <!-- Search Filter -->
                <div class="mb-8 max-w-md mx-auto">
                    <input type="text" x-model="searchQuery" placeholder="Search group name, tour, or city..." class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-pink-500 transition-colors shadow-inner">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <template x-for="concert in filteredConcerts" :key="concert.id">
                        <div class="bg-slate-900/80 border border-slate-800/80 rounded-2xl overflow-hidden hover:border-slate-700 transition-all duration-300 flex flex-col group shadow-xl">
                            <!-- Group Photo Card Header -->
                            <div class="h-52 relative overflow-hidden bg-slate-950">
                                <img :src="concert.image" :alt="concert.artist" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700 opacity-90">
                                <div class="absolute inset-0 bg-gradient-to-t from-slate-900 via-transparent to-black/30"></div>
                                <div class="absolute top-4 left-4 right-4 flex justify-between items-center z-10">
                                    <span class="px-3 py-1 rounded-lg bg-black/60 backdrop-blur-md text-xs font-semibold uppercase tracking-wider text-pink-400 border border-white/10" x-text="concert.genre"></span>
                                    <span class="px-2.5 py-1 rounded-lg bg-pink-500/30 backdrop-blur-md text-pink-200 text-xs font-bold border border-pink-500/40 shadow-sm" x-text="concert.status"></span>
                                </div>
                                <div class="absolute bottom-3 left-4 right-4 z-10">
                                    <h3 class="text-2xl font-black text-white group-hover:text-pink-400 transition-colors drop-shadow-md" x-text="concert.artist"></h3>
                                    <p class="text-xs text-slate-200 font-medium drop-shadow" x-text="concert.tour"></p>
                                </div>
                            </div>

                            <div class="p-5 flex-1 flex flex-col justify-between space-y-4">
                                <div class="space-y-2 text-xs text-slate-400">
                                    <div class="flex items-center gap-2">
                                        <svg class="w-4 h-4 text-pink-500 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                                        <span x-text="concert.venue"></span>
                                    </div>
                                    <div class="flex items-center gap-2">
                                        <svg class="w-4 h-4 text-pink-500 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                                        <span x-text="concert.date"></span>
                                    </div>
                                </div>
                                <button @click="joinQueue(concert)" class="w-full py-2.5 px-4 rounded-xl bg-gradient-to-r from-pink-500 to-purple-600 font-semibold text-sm text-white shadow-lg shadow-pink-500/20 hover:opacity-90 active:scale-[0.98] transition-all">
                                    Get Tickets
                                </button>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </template>

        <!-- VIEW 2: VIRTUAL QUEUE WAITING ROOM -->
        <template x-if="step === 'queue'">
            <div class="max-w-md mx-auto mt-12 bg-slate-900 border border-slate-800 rounded-3xl p-8 text-center shadow-2xl relative overflow-hidden">
                <div class="absolute -top-24 -right-24 w-48 h-48 bg-pink-500/10 rounded-full blur-3xl"></div>
                <div class="w-16 h-16 bg-pink-500/10 border border-pink-500/20 rounded-2xl mx-auto flex items-center justify-center text-pink-400 mb-6">
                    <svg class="w-8 h-8 animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                </div>
                <h2 class="text-2xl font-bold mb-2">Virtual Queue Active</h2>
                <p class="text-xs text-slate-400 mb-6" x-text="selectedConcert?.artist + ' — ' + selectedConcert?.tour"></p>
                
                <div class="bg-slate-950 border border-slate-800/80 rounded-2xl p-6 mb-6">
                    <span class="text-xs text-slate-400 uppercase tracking-widest block mb-1">Your Queue Position</span>
                    <span class="text-4xl font-black text-white tracking-tight" x-text="queuePosition"></span>
                    <div class="w-full bg-slate-800 h-2 rounded-full mt-4 overflow-hidden">
                        <div class="bg-gradient-to-r from-pink-500 to-purple-500 h-full transition-all duration-300" :style="`width: ${queueProgress}%`"></div>
                    </div>
                    <span class="text-[11px] text-slate-500 mt-2 block">Estimated wait time: <span class="text-slate-300" x-text="queueTime"></span></span>
                </div>
                <p class="text-xs text-slate-500">Please do not refresh this page or close your browser tab.</p>
            </div>
        </template>

        <!-- VIEW 3: SEAT SELECTION MAP -->
        <template x-if="step === 'seats'">
            <div>
                <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6 bg-slate-900 border border-slate-800 p-4 rounded-2xl">
                    <div>
                        <h2 class="text-xl font-bold" x-text="selectedConcert?.artist"></h2>
                        <p class="text-xs text-slate-400">Select up to 4 seats from the arena map below.</p>
                    </div>
                    <div class="flex items-center gap-4 text-xs font-medium">
                        <div class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-slate-800 border border-slate-700"></span> Available</div>
                        <div class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-pink-500 shadow-sm shadow-pink-500"></span> Selected</div>
                        <div class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-slate-900/40 text-slate-700 border border-slate-800"></span> Taken</div>
                    </div>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <!-- Arena Map Area -->
                    <div class="lg:col-span-2 bg-slate-900/80 border border-slate-800 rounded-3xl p-6 flex flex-col items-center justify-center relative min-h-[420px]">
                        <!-- Stage Indicator -->
                        <div class="w-3/4 bg-gradient-to-r from-slate-800 via-pink-500/20 to-slate-800 border border-pink-500/30 rounded-xl py-2 text-center text-xs font-bold uppercase tracking-widest text-pink-300 mb-8 shadow-lg shadow-pink-500/5">
                            Main Stage & Extended Thrust
                        </div>

                        <!-- Seat Grid -->
                        <div class="grid grid-cols-6 gap-3 max-w-md w-full">
                            <template x-for="seat in seats" :key="seat.id">
                                <button @click="toggleSeat(seat)" 
                                    :disabled="seat.status === 'booked'"
                                    :class="{
                                        'bg-slate-800 hover:border-pink-500 text-slate-300 border-slate-700': seat.status === 'available' && !selectedSeats.includes(seat.id),
                                        'bg-pink-500 text-white border-pink-400 shadow-lg shadow-pink-500/30 scale-105': selectedSeats.includes(seat.id),
                                        'bg-slate-900/40 text-slate-700 border-slate-900 cursor-not-allowed': seat.status === 'booked'
                                    }"
                                    class="border rounded-xl py-3 text-xs font-bold transition-all flex flex-col items-center justify-center gap-0.5">
                                    <span x-text="seat.name"></span>
                                    <span class="text-[9px] opacity-75" x-text="'$' + seat.price"></span>
                                </button>
                            </template>
                        </div>
                    </div>

                    <!-- Cart / Checkout Summary Drawer -->
                    <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 flex flex-col justify-between">
                        <div>
                            <h3 class="font-bold text-base mb-4 flex items-center justify-between">
                                <span>Reservation Cart</span>
                                <span class="text-xs px-2.5 py-0.5 rounded-full bg-pink-500/10 text-pink-400 border border-pink-500/20 font-mono" x-text="formatTime(cartTimer)"></span>
                            </h3>
                            <div class="space-y-2 mb-6 max-h-48 overflow-y-auto">
                                <template x-if="selectedSeats.length === 0">
                                    <p class="text-xs text-slate-500 italic py-4 text-center">No seats selected yet. Click available seats on the map.</p>
                                </template>
                                <template x-for="seatId in selectedSeats" :key="seatId">
                                    <div class="flex justify-between items-center bg-slate-950 px-3 py-2.5 rounded-xl border border-slate-800/80 text-xs">
                                        <div>
                                            <span class="font-bold text-white" x-text="getSeatDetails(seatId).name"></span>
                                            <span class="text-slate-400 block text-[10px]" x-text="getSeatDetails(seatId).tier"></span>
                                        </div>
                                        <div class="flex items-center gap-3">
                                            <span class="font-semibold text-pink-400" x-text="'$' + getSeatDetails(seatId).price"></span>
                                            <button @click="toggleSeat(getSeatDetails(seatId))" class="text-slate-500 hover:text-red-400">×</button>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </div>

                        <div class="border-t border-slate-800 pt-4 space-y-4">
                            <div class="flex justify-between items-center text-sm font-bold">
                                <span>Total Amount:</span>
                                <span class="text-lg text-pink-400" x-text="'$' + calculateTotal()"></span>
                            </div>
                            <button @click="proceedToCheckout()" :disabled="selectedSeats.length === 0" class="w-full py-3 rounded-xl bg-gradient-to-r from-pink-500 to-purple-600 font-bold text-sm text-white shadow-lg shadow-pink-500/20 hover:opacity-90 disabled:opacity-40 disabled:cursor-not-allowed transition-all">
                                Proceed to Checkout
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </template>

        <!-- VIEW 4: CHECKOUT FORM -->
        <template x-if="step === 'checkout'">
            <div class="max-w-xl mx-auto bg-slate-900 border border-slate-800 rounded-3xl p-8 shadow-2xl">
                <h2 class="text-2xl font-bold mb-1">Fan Verification & Payment</h2>
                <p class="text-xs text-slate-400 mb-6">Named ticket policy active: Attendee name must match government ID.</p>

                <form @submit.prevent="completeBooking()" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Full Name (As per ID)</label>
                        <input type="text" required x-model="formData.name" placeholder="e.g. Kim Minji" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-pink-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Email Address (For e-Ticket QR delivery)</label>
                        <input type="email" required x-model="formData.email" placeholder="minji@example.com" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-pink-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Official Fanclub Membership ID (Optional)</label>
                        <input type="text" x-model="formData.membershipId" placeholder="e.g. FANDOM-9921" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-pink-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Payment Method</label>
                        <select class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-pink-500">
                            <option>Credit / Debit Card (Stripe Secure)</option>
                            <option>GCash / Local Mobile Wallet</option>
                            <option>KakaoPay / Toss</option>
                        </select>
                    </div>

                    <div class="pt-4">
                        <button type="submit" :disabled="isProcessing" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-pink-500 to-purple-600 font-bold text-sm text-white shadow-lg shadow-pink-500/20 hover:opacity-90 transition-all flex items-center justify-center gap-2">
                            <template x-if="isProcessing">
                                <svg class="w-5 h-5 animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                            </template>
                            <span x-text="isProcessing ? 'Processing Payment & Charging Card...' : 'Complete Secure Payment ($' + calculateTotal() + ')'"></span>
                        </button>
                    </div>
                </form>
            </div>
        </template>

        <!-- VIEW 5: SUCCESS & E-TICKET CONFIRMATION -->
        <template x-if="step === 'success'">
            <div class="max-w-md mx-auto bg-slate-900 border border-slate-800 rounded-3xl p-8 text-center shadow-2xl">
                <div class="w-16 h-16 bg-emerald-500/10 border border-emerald-500/20 rounded-2xl mx-auto flex items-center justify-center text-emerald-400 mb-6">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                </div>
                <h2 class="text-2xl font-bold mb-1">Booking Confirmed & Charged!</h2>
                <p class="text-xs text-slate-400 mb-6">Payment verified and processed securely via Idempotent Gateway.</p>

                <div class="bg-slate-950 border border-slate-800/80 rounded-2xl p-5 text-left space-y-3 mb-6 text-xs">
                    <div class="flex justify-between"><span class="text-slate-500">Booking Reference:</span> <span class="font-mono font-bold text-pink-400" x-text="bookingRef"></span></div>
                    <div class="flex justify-between"><span class="text-slate-500">Artist / Tour:</span> <span class="font-bold text-white" x-text="selectedConcert?.artist"></span></div>
                    <div class="flex justify-between"><span class="text-slate-500">Ticket Holder:</span> <span class="font-bold text-white" x-text="formData.name"></span></div>
                    <div class="flex justify-between"><span class="text-slate-500">Secured Seats:</span> <span class="font-bold text-white" x-text="selectedSeats.join(', ')"></span></div>
                </div>

                <div class="flex gap-3">
                    <button @click="openMyTickets()" class="flex-1 py-3 rounded-xl bg-pink-500 font-bold text-sm text-white hover:opacity-90 transition-all">
                        View My Tickets (<span x-text="myBookings.length"></span>)
                    </button>
                    <button @click="resetToHome()" class="flex-1 py-3 rounded-xl bg-slate-800 font-bold text-sm text-white hover:bg-slate-700 transition-all">
                        Book More
                    </button>
                </div>
            </div>
        </template>

        <!-- VIEW 6: MY TICKETS MODAL / PAGE -->
        <template x-if="step === 'my-tickets'">
            <div class="max-w-2xl mx-auto">
                <div class="flex items-center justify-between mb-6">
                    <div>
                        <h2 class="text-2xl font-bold">My Booked Tickets</h2>
                        <p class="text-xs text-slate-400">Total tickets secured: <span class="font-bold text-pink-400" x-text="totalTicketsCount"></span></p>
                    </div>
                    <button @click="resetToHome()" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-semibold transition-all">
                        ← Back to Concerts
                    </button>
                </div>

                <template x-if="myBookings.length === 0">
                    <div class="bg-slate-900 border border-slate-800 rounded-3xl p-12 text-center text-slate-500">
                        <p class="text-sm">You haven't booked any concert tickets yet!</p>
                    </div>
                </template>

                <div class="space-y-4">
                    <template x-for="booking in myBookings" :key="booking.ref">
                        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 flex flex-col sm:flex-row justify-between gap-4 items-start sm:items-center shadow-lg">
                            <div>
                                <span class="text-[10px] font-mono px-2 py-0.5 rounded bg-pink-500/10 text-pink-400 border border-pink-500/20" x-text="booking.ref"></span>
                                <h3 class="text-lg font-bold text-white mt-2" x-text="booking.artist"></h3>
                                <p class="text-xs text-slate-400" x-text="booking.tour"></p>
                                <div class="mt-3 flex flex-wrap gap-2 text-xs text-slate-300">
                                    <span class="bg-slate-950 px-2.5 py-1 rounded-lg border border-slate-800">Holder: <strong class="text-white" x-text="booking.name"></strong></span>
                                    <span class="bg-slate-950 px-2.5 py-1 rounded-lg border border-slate-800">Seats: <strong class="text-pink-400" x-text="booking.seats.join(', ')"></strong></span>
                                </div>
                            </div>
                            <div class="text-right sm:text-right w-full sm:w-auto border-t sm:border-t-0 pt-3 sm:pt-0 border-slate-800 flex sm:flex-col justify-between items-center sm:items-end">
                                <span class="text-xs text-slate-500 font-mono" x-text="booking.date"></span>
                                <span class="text-base font-bold text-emerald-400 mt-1" x-text="'$' + booking.total"></span>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </template>

    </main>

    <!-- JS LOGIC ENGINE -->
    <script>
        function ticketingApp() {
            return {
                step: 'listing',
                searchQuery: '',
                queuePosition: 1420,
                queueProgress: 15,
                queueTime: '01:45',
                cartTimer: 600,
                timerInterval: null,
                isProcessing: false,
                bookingRef: '',
                selectedConcert: null,
                selectedSeats: [],
                formData: { name: '', email: '', membershipId: '' },
                myBookings: [],
                
                concerts: [
                    { id: 1, artist: 'ILLIT', tour: 'SUPER REAL ME World Tour', venue: 'KSPO Dome, Seoul', date: 'July 12, 2026', genre: 'Girl Group', status: 'Presale Live', image: 'https://images.unsplash.com/photo-1529156069898-49953e39b3ac?auto=format&fit=crop&w=800&q=80' },
                    { id: 2, artist: 'CORTIZ', tour: '1st World Tour: Young Creators', venue: 'Tokyo Dome, Japan', date: 'August 04, 2026', genre: 'Boy Group', status: 'Hot', image: 'https://images.unsplash.com/photo-1501386761578-eac5c94b800a?auto=format&fit=crop&w=800&q=80' },
                    { id: 3, artist: 'UNIS', tour: 'CURIOUS Universe Live', venue: 'Skydome, Seoul', date: 'August 18, 2026', genre: 'Girl Group', status: 'Selling Fast', image: 'https://images.unsplash.com/photo-1526478806334-5fd488fcaabc?auto=format&fit=crop&w=800&q=80' },
                    { id: 4, artist: 'LNGSHOT', tour: 'SHOT CALLERS Tour', venue: 'Mall of Asia Arena, Manila', date: 'September 10, 2026', genre: 'Boy Group', status: 'Presale Live', image: 'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?auto=format&fit=crop&w=800&q=80' },
                    { id: 5, artist: 'AHOF', tour: '1st Tour: The First Spark', venue: 'KSPO Dome, Seoul', date: 'September 22, 2026', genre: 'Boy Group', status: 'Hot', image: 'https://images.unsplash.com/photo-1540039155733-5bb30b53aa14?auto=format&fit=crop&w=800&q=80' },
                    { id: 6, artist: 'BTS', tour: 'The Reunion World Tour', venue: 'SoFi Stadium, Los Angeles', date: 'October 05, 2026', genre: 'Global Pop', status: 'Selling Fast', image: 'https://images.unsplash.com/photo-1516450360452-9312f5e86fc7?auto=format&fit=crop&w=800&q=80' },
                    { id: 7, artist: 'BLACKPINK', tour: 'BORN PINK ENCORE', venue: 'MetLife Stadium, New York', date: 'October 20, 2026', genre: 'Global Pop', status: 'Selling Fast', image: 'https://images.unsplash.com/photo-1492684223066-81342ee5ff30?auto=format&fit=crop&w=800&q=80' },
                    { id: 8, artist: 'SEVENTEEN', tour: 'RIGHT HERE World Tour', venue: 'Tokyo Dome, Japan', date: 'November 08, 2026', genre: 'Boy Group', status: 'Hot', image: 'https://images.unsplash.com/photo-1470225620780-dba8ba36b745?auto=format&fit=crop&w=800&q=80' },
                    { id: 9, artist: 'TWICE', tour: 'THIS IS US World Tour', venue: 'Qudos Bank Arena, Sydney', date: 'November 25, 2026', genre: 'Girl Group', status: 'Hot', image: 'https://images.unsplash.com/photo-1514525253161-7a46d19cd819?auto=format&fit=crop&w=800&q=80' },
                    { id: 10, artist: 'NewJeans', tour: 'Supernatural Live Arena', venue: 'Barysh Arena, Seoul', date: 'December 10, 2026', genre: 'Girl Group', status: 'Presale Live', image: 'https://images.unsplash.com/photo-1520523839896-519881a704f4?auto=format&fit=crop&w=800&q=80' },
                    { id: 11, artist: 'aespa', tour: 'SYNK : PARALLEL LINE', venue: 'ICE BSD, Jakarta', date: 'January 15, 2027', genre: 'Girl Group', status: 'Selling Fast', image: 'https://images.unsplash.com/photo-1508700115892-45ecd05ae2ad?auto=format&fit=crop&w=800&q=80' }
                ],

                seats: [
                    { id: 'S1', name: 'VIP 1', tier: 'Soundcheck Floor', price: 280, status: 'available' },
                    { id: 'S2', name: 'VIP 2', tier: 'Soundcheck Floor', price: 280, status: 'booked' },
                    { id: 'S3', name: 'VIP 3', tier: 'Soundcheck Floor', price: 280, status: 'available' },
                    { id: 'S4', name: 'VIP 4', tier: 'Soundcheck Floor', price: 280, status: 'available' },
                    { id: 'S5', name: 'P1-1', tier: 'Lower Box A', price: 190, status: 'available' },
                    { id: 'S6', name: 'P1-2', tier: 'Lower Box A', price: 190, status: 'booked' },
                    { id: 'S7', name: 'P1-3', tier: 'Lower Box A', price: 190, status: 'available' },
                    { id: 'S8', name: 'P1-4', tier: 'Lower Box A', price: 190, status: 'available' },
                    { id: 'S9', name: 'P2-1', tier: 'Upper Box B', price: 110, status: 'available' },
                    { id: 'S10', name: 'P2-2', tier: 'Upper Box B', price: 110, status: 'available' },
                    { id: 'S11', name: 'P2-3', tier: 'Upper Box B', price: 110, status: 'booked' },
                    { id: 'S12', name: 'P2-4', tier: 'Upper Box B', price: 110, status: 'available' }
                ],

                get filteredConcerts() {
                    if (!this.searchQuery) return this.concerts;
                    return this.concerts.filter(c => 
                        c.artist.toLowerCase().includes(this.searchQuery.toLowerCase()) ||
                        c.tour.toLowerCase().includes(this.searchQuery.toLowerCase()) ||
                        c.venue.toLowerCase().includes(this.searchQuery.toLowerCase())
                    );
                },

                get totalTicketsCount() {
                    return this.myBookings.reduce((sum, b) => sum + b.seats.length, 0);
                },

                joinQueue(concert) {
                    this.selectedConcert = concert;
                    this.selectedSeats = [];
                    // Clear form data so previous name doesn't persist
                    this.formData = { name: '', email: '', membershipId: '' };
                    this.step = 'queue';
                    this.queuePosition = Math.floor(Math.random() * 800) + 200;
                    this.queueProgress = 15;
                    
                    let interval = setInterval(() => {
                        this.queuePosition -= Math.floor(Math.random() * 70) + 30;
                        this.queueProgress += 25;
                        if (this.queuePosition <= 0) {
                            this.queuePosition = 0;
                            this.queueProgress = 100;
                            clearInterval(interval);
                            setTimeout(() => {
                                this.step = 'seats';
                                this.startCartTimer();
                            }, 600);
                        }
                    }, 800);
                },

                startCartTimer() {
                    this.cartTimer = 600;
                    if (this.timerInterval) clearInterval(this.timerInterval);
                    this.timerInterval = setInterval(() => {
                        if (this.cartTimer > 0) {
                            this.cartTimer--;
                        } else {
                            clearInterval(this.timerInterval);
                            alert('Cart session expired! Please re-enter queue.');
                            this.resetToHome();
                        }
                    }, 1000);
                },

                formatTime(seconds) {
                    let m = Math.floor(seconds / 60);
                    let s = seconds % 60;
                    return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
                },

                toggleSeat(seat) {
                    if (seat.status === 'booked') return;
                    let index = this.selectedSeats.indexOf(seat.id);
                    if (index > -1) {
                        this.selectedSeats.splice(index, 1);
                    } else {
                        if (this.selectedSeats.length >= 4) {
                            alert('Maximum limit of 4 seats per booking reached.');
                            return;
                        }
                        this.selectedSeats.push(seat.id);
                    }
                },

                getSeatDetails(id) {
                    return this.seats.find(s => s.id === id) || {};
                },

                calculateTotal() {
                    return this.selectedSeats.reduce((sum, id) => sum + (this.getSeatDetails(id).price || 0), 0);
                },

                proceedToCheckout() {
                    if (this.selectedSeats.length === 0) return;
                    this.step = 'checkout';
                },

                completeBooking() {
                    this.isProcessing = true;
                    if (this.timerInterval) clearInterval(this.timerInterval);
                    
                    // Simulate automatic payment gateway charging delay
                    setTimeout(() => {
                        this.isProcessing = false;
                        this.bookingRef = 'KP-' + Math.random().toString(36).substring(2, 9).toUpperCase();
                        
                        // Save booking into user history tracker
                        this.myBookings.push({
                            ref: this.bookingRef,
                            artist: this.selectedConcert.artist,
                            tour: this.selectedConcert.tour,
                            name: this.formData.name,
                            email: this.formData.email,
                            seats: [...this.selectedSeats],
                            total: this.calculateTotal(),
                            date: new Date().toLocaleDateString()
                        });

                        this.step = 'success';
                    }, 1500);
                },

                openMyTickets() {
                    if (this.timerInterval) clearInterval(this.timerInterval);
                    this.step = 'my-tickets';
                },

                resetToHome() {
                    if (this.timerInterval) clearInterval(this.timerInterval);
                    this.step = 'listing';
                    this.selectedSeats = [];
                    this.searchQuery = '';
                    this.formData = { name: '', email: '', membershipId: '' };
                }
            }
        }
    </script>
